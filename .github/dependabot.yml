# Dependabot retune 2026-09-10: this repo is deployed, so version updates stay on,
# but monthly with a small PR cap. Security updates are a repo setting and unaffected.
version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  reviewers:
  - gr8monk3ys
  labels:
  - dependencies
  - python
  commit-message:
    prefix: deps
    include: scope
  groups:
    python-minor:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    python-major:
      patterns:
      - '*'
      update-types:
      - major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  reviewers:
  - gr8monk3ys
  labels:
  - dependencies
  - ci
  commit-message:
    prefix: ci(deps)
  ignore:
  - dependency-name: gr8monk3ys/*
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  reviewers:
  - gr8monk3ys
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: docker(deps)
