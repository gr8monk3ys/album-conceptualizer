permissions: read-all

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # verify_summary.py writes <stage>.json here; merged by the verify-report job.
  VERIFY_STAGE_DIR: verify-stages

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install ruff

      - name: Ruff lint + format check
        run: make verify-lint PY=

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run tests (coverage gate 85%)
        run: make verify-test PY=

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py python-${{ matrix.python-version }} reports/python.xml

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-stage-test-${{ matrix.python-version }}
          path: verify-stages/
          retention-days: 1

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run mypy
        run: make verify-typecheck PY=

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install pip-audit

      - name: Run pip-audit
        run: make verify-audit PY=

  optional-stack:
    name: Optional Stack Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install optional dependencies
        run: |
          uv pip install -e ".[dev,music,rag]"

      - name: Run optional dependency smoke tests
        run: make verify-optional PY_OPT=

      - name: Test-count evidence
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py optional reports/optional.xml

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-stage-optional-stack
          path: verify-stages/
          retention-days: 1


  web-lighthouse:
    name: Web Lighthouse
    # Pinned: ubuntu-latest is now 26.04, where this repo's Playwright cannot
    # install Chromium. Back to ubuntu-latest after a Playwright upgrade.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_conceptualizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d album_conceptualizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/album_conceptualizer?schema=album_conceptualizer
      PRISMA_ADAPTER: pg
      NEXTAUTH_SECRET: dev-secret
      AUTH_SECRET: dev-secret
      ENABLE_DEV_LOGIN: "1"
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "1"
      AC_E2E: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # run-lighthouse-auth.mjs signs in through Playwright's chromium before
      # handing the profile to Lighthouse. Without this step the job dies at
      # launchPersistentContext with "Executable doesn't exist at
      # ~/.cache/ms-playwright/chromium_headless_shell-*" -- the public audit
      # passes because it only needs the runner's system Chrome.
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma migrations
        working-directory: apps/web
        run: npm run prisma:migrate:deploy

      - name: Run public Lighthouse audit
        env:
          LIGHTHOUSE_PORT: "3300"
          NEXTAUTH_URL: http://127.0.0.1:3300
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
        run: bash scripts/web-lighthouse-public.sh

      - name: Run authenticated Lighthouse audit
        env:
          LIGHTHOUSE_PORT: "3301"
          NEXTAUTH_URL: http://127.0.0.1:3301
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3301
        run: bash scripts/web-lighthouse-auth.sh

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-lighthouse
          path: |
            output/lighthouse/public/
            output/lighthouse/auth/

  web-e2e:
    name: Web E2E (Playwright)
    # Pinned: ubuntu-latest is now 26.04, where this repo's Playwright cannot
    # install Chromium. Back to ubuntu-latest after a Playwright upgrade.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_conceptualizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d album_conceptualizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/album_conceptualizer?schema=album_conceptualizer
      NEXTAUTH_SECRET: dev-secret
      AUTH_SECRET: dev-secret
      ENABLE_DEV_LOGIN: "1"
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "1"
      # Required: next start runs as NODE_ENV=production, and auth.ts only
      # registers the dev-login provider when AC_E2E=1 in production. Without
      # it the provider list is EMPTY and buildAuthOptions() throws, so every
      # /api/auth/* call 500s -- the sign-in button renders, nothing behind it
      # works. Also what keeps /api/health out of strict-production mode.
      AC_E2E: "1"
      # Match web-lighthouse; db.ts defaults to pg for non-neon URLs anyway.
      PRISMA_ADAPTER: pg
      # The export/handoff routes proxy to the Python engine, started below.
      ENGINE_API_URL: http://127.0.0.1:8000/api/v1
      NEXTAUTH_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Without an engine, engineFetch falls back to localhost:8000, nothing
      # answers, and every download spec times out on waitForEvent("download")
      # with only "TypeError: fetch failed" in the server log to explain it.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python for the engine
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install the engine
        run: uv pip install -e .

      - name: Start the engine
        run: |
          uvicorn album_conceptualizer.api.app:app --host 127.0.0.1 --port 8000 \
            > /tmp/engine.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "engine up"; exit 0
            fi
            sleep 1
          done
          echo "engine did not start within 60s" >&2
          cat /tmp/engine.log >&2
          exit 1

      - name: Engine log
        if: always()
        run: tail -50 /tmp/engine.log || true

      - name: Apply Prisma migrations
        working-directory: apps/web
        run: npm run prisma:migrate:deploy

      - name: Lint, typecheck, unit-test and build the web app
        run: make verify-web

      - name: Test-count evidence (web unit)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py web-unit reports/web-unit.json

      - name: Run Playwright E2E tests
        run: make verify-e2e

      - name: Test-count evidence (e2e)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_summary.py e2e reports/e2e.json

      - name: Upload VERIFY stage counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-stage-web-e2e
          path: verify-stages/
          retention-days: 1

      - name: Upload UI evidence (screenshots + traces)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ui-evidence
          path: apps/web/test-results/
          if-no-files-found: error

      - name: List UI evidence in the job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### ui-evidence artifact"
            echo
            find apps/web/test-results -type f \( -name '*.png' -o -name 'trace.zip' \) | sort | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-web-e2e
          path: apps/web/playwright-report/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security, optional-stack, web-lighthouse, web-e2e]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security, optional-stack, web-lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The workflow-level `permissions: read-all` gives GITHUB_TOKEN no
    # packages scope, so every push to ghcr.io was refused with "denied:
    # installation not allowed to Create organization package" and main
    # stayed red for weeks. Grant the one scope the push needs, here only.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true

  verify-report:
    # Merges every job's VERIFY stage counts into one machine-readable artifact for the merge gate
    # (job summaries aren't readable via the REST API). Fails if any expected stage is missing.
    name: Verify Report
    runs-on: ubuntu-latest
    needs: [test, optional-stack, web-e2e]
    if: always()

    steps:
      - name: Download stage counts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: verify-stage-*
          path: verify-stages
          merge-multiple: true

      - name: Merge into verify-report.json
        env:
          EXPECTED_STAGES: python-3.11 python-3.12 python-3.13 optional web-unit e2e
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for s in $EXPECTED_STAGES; do
            f="verify-stages/$s.json"
            [ -f "$f" ] || { echo "::error::missing VERIFY stage '$s'"; exit 1; }
            jq -e --arg s "$s" '.stage == $s and ([.tests, .passed, .failed, .skipped] | all(type == "number" and . == floor and . >= 0))
              and (.passed_ids | type == "array" and all(type == "string"))' "$f" > /dev/null \
              || { echo "::error::unparseable VERIFY stage '$s'"; cat "$f"; exit 1; }
          done
          jq -n --arg repo "$REPO" --arg commit "$COMMIT" '{schema: 1, repo: $repo, commit: $commit, stages: [inputs | .passed_ids |= (unique | sort)]}' \
            $(for s in $EXPECTED_STAGES; do echo "verify-stages/$s.json"; done) > verify-report.json
          cat verify-report.json

      - name: Upload verify-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verify-report
          path: verify-report.json
          retention-days: 30
