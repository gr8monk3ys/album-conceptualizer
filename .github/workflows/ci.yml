permissions: read-all

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv pip install ruff

      - name: Run Ruff linter
        run: ruff check album_conceptualizer/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check album_conceptualizer/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=album_conceptualizer --cov-report=xml --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run mypy
        run: mypy album_conceptualizer/ --ignore-missing-imports

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

  optional-stack:
    name: Optional Stack Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install optional dependencies
        run: |
          uv pip install -e ".[dev,music,rag]"

      - name: Run optional dependency smoke tests
        run: |
          pytest \
            tests/test_export.py::TestMidiExport \
            tests/test_export_integration.py \
            tests/test_rag.py::TestEmbeddings \
            -v --tb=short


  web-lighthouse:
    name: Web Lighthouse
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_conceptualizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d album_conceptualizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/album_conceptualizer?schema=album_conceptualizer
      PRISMA_ADAPTER: pg
      NEXTAUTH_SECRET: dev-secret
      AUTH_SECRET: dev-secret
      ENABLE_DEV_LOGIN: "1"
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "1"
      AC_E2E: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Apply Prisma migrations
        working-directory: apps/web
        run: npm run prisma:migrate:deploy

      - name: Run public Lighthouse audit
        env:
          LIGHTHOUSE_PORT: "3300"
          NEXTAUTH_URL: http://127.0.0.1:3300
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3300
        run: bash scripts/web-lighthouse-public.sh

      - name: Run authenticated Lighthouse audit
        env:
          LIGHTHOUSE_PORT: "3301"
          NEXTAUTH_URL: http://127.0.0.1:3301
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3301
        run: bash scripts/web-lighthouse-auth.sh

      - name: Upload Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-lighthouse
          path: |
            output/lighthouse/public/
            output/lighthouse/auth/

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: album_conceptualizer
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d album_conceptualizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5434/album_conceptualizer?schema=album_conceptualizer
      NEXTAUTH_SECRET: dev-secret
      AUTH_SECRET: dev-secret
      ENABLE_DEV_LOGIN: "1"
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "1"
      # Required: next start runs as NODE_ENV=production, and auth.ts only
      # registers the dev-login provider when AC_E2E=1 in production. Without
      # it the provider list is EMPTY and buildAuthOptions() throws, so every
      # /api/auth/* call 500s -- the sign-in button renders, nothing behind it
      # works. Also what keeps /api/health out of strict-production mode.
      AC_E2E: "1"
      # Match web-lighthouse; db.ts defaults to pg for non-neon URLs anyway.
      PRISMA_ADAPTER: pg
      # The export/handoff routes proxy to the Python engine, started below.
      ENGINE_API_URL: http://127.0.0.1:8000/api/v1
      NEXTAUTH_URL: http://127.0.0.1:3002
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Without an engine, engineFetch falls back to localhost:8000, nothing
      # answers, and every download spec times out on waitForEvent("download")
      # with only "TypeError: fetch failed" in the server log to explain it.
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python for the engine
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install the engine
        run: uv pip install -e .

      - name: Start the engine
        run: |
          uvicorn album_conceptualizer.api.app:app --host 127.0.0.1 --port 8000 \
            > /tmp/engine.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health > /dev/null 2>&1; then
              echo "engine up"; exit 0
            fi
            sleep 1
          done
          echo "engine did not start within 60s" >&2
          cat /tmp/engine.log >&2
          exit 1

      - name: Engine log
        if: always()
        run: tail -50 /tmp/engine.log || true

      - name: Apply Prisma migrations
        working-directory: apps/web
        run: npm run prisma:migrate:deploy

      - name: Build Next.js app
        working-directory: apps/web
        run: npm run build

      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: playwright-web-e2e
          path: apps/web/playwright-report/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security, optional-stack, web-lighthouse, web-e2e]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dist
          path: dist/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security, optional-stack, web-lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          skip-existing: true
