name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**", "fix/**", "gr8monk3ys/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_SYSTEM_PYTHON: 1

jobs:
  # ---------- Python ----------

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv pip install --system ruff

      - name: Run Ruff linter
        run: ruff check album_conceptualizer/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check album_conceptualizer/ tests/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-

      - name: Install dependencies (with test extras)
        run: uv pip install --system -e ".[test]"

      - name: Run pytest
        run: python -m pytest tests/ -x --tb=short

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: test-key
      OPENAI_API_KEY: test-key
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Verify crewai is installed
        run: python -c "import crewai; print('crewai', crewai.__version__)"

      - name: Run all tests (including agent tests)
        run: |
          pytest tests/ -v --tb=short --cov=album_conceptualizer --cov-report=xml --cov-fail-under=50

      - name: Verify agent tests were not skipped
        run: |
          python -c "
          import subprocess, sys
          r = subprocess.run(
              ['pytest', 'tests/test_agents.py', '--co', '-q'],
              capture_output=True, text=True
          )
          if 'no tests ran' in r.stdout or r.returncode != 0:
              print('ERROR: agent tests were skipped or failed collection')
              print(r.stdout)
              print(r.stderr)
              sys.exit(1)
          print('Agent test collection OK')
          print(r.stdout)
          "

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run mypy
        run: mypy album_conceptualizer/ --ignore-missing-imports

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pip-audit

      - name: Run pip-audit
        run: pip-audit

  optional-stack:
    name: Optional Stack Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install optional dependencies
        run: |
          uv pip install --system -e ".[dev,music,rag]"

      - name: Run optional dependency smoke tests
        run: |
          pytest \
            tests/test_export.py::TestMidiExport \
            tests/test_export_integration.py \
            tests/test_rag.py::TestEmbeddings \
            -v --tb=short

  # ---------- TypeScript / Next.js ----------

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run TypeScript type check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Run Next.js lint
        working-directory: apps/web
        run: npx next lint

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Build web
        working-directory: apps/web
        run: npm run build

  # ---------- E2E ----------

  ui-e2e:
    name: UI E2E (Playwright CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI E2E dependencies
        run: |
          uv pip install --system -e ".[dev,ui,music]"

      - name: Run Playwright CLI UI E2E
        run: |
          bash scripts/ui-e2e-playwright.sh

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-ui-e2e
          path: |
            output/playwright/
            .playwright-cli/

  web-e2e:
    name: Web E2E (Next.js + Engine)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: album_conceptualizer
        options: >-
          --health-cmd="pg_isready -U postgres -d album_conceptualizer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/album_conceptualizer?schema=public
      PRISMA_ADAPTER: pg
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-secret
      ENABLE_DEV_LOGIN: "1"
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "1"
      AC_E2E: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ENGINE_API_URL: http://localhost:8000/api/v1
      ENGINE_API_KEY: ""
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install engine dependencies
        run: |
          uv pip install --system -e ".[dev,music]"

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Apply Prisma migrations
        working-directory: apps/web
        run: npm run prisma:migrate:deploy

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Run web E2E
        run: |
          set -euo pipefail

          uvicorn album_conceptualizer.api.app:app --host 0.0.0.0 --port 8000 &
          ENGINE_PID=$!

          (cd apps/web && npm run start -- -p 3000) &
          WEB_PID=$!

          cleanup() {
            kill $ENGINE_PID $WEB_PID || true
          }
          trap cleanup EXIT

          echo "Waiting for engine..."
          ENGINE_OK=0
          for i in {1..60}; do
            if curl -sf http://localhost:8000/health >/dev/null; then
              ENGINE_OK=1
              break
            fi
            sleep 1
          done
          if [ "$ENGINE_OK" -ne 1 ]; then
            echo "Engine failed to start"
            exit 1
          fi

          echo "Waiting for web..."
          WEB_OK=0
          for i in {1..90}; do
            if curl -sf http://localhost:3000/api/health >/dev/null; then
              WEB_OK=1
              break
            fi
            sleep 1
          done
          if [ "$WEB_OK" -ne 1 ]; then
            echo "Web failed to start"
            exit 1
          fi

          (cd apps/web && npm run test:e2e)

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-web-e2e
          path: |
            apps/web/playwright-report/
            apps/web/test-results/

  # ---------- Docker ----------

  docker-build:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    # Only validate Docker builds on pushes to main and pull requests (not every feature branch push)
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python API Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          tags: album-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Note: The Next.js app does not have a Dockerfile yet.
      # When apps/web/Dockerfile is added, uncomment the step below.
      # - name: Build Next.js Docker image (no push)
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: apps/web
      #     push: false
      #     tags: album-web:ci
      #     cache-from: type=gha
      #     cache-to: type=gha,mode=max

  # ---------- Packaging & Release ----------

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, python-tests, test, type-check, typescript-check, security, optional-stack, ui-e2e, web, web-e2e]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, python-tests, test, type-check, typescript-check, security, optional-stack, ui-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release:')
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download artifact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
