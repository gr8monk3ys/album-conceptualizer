services:
  # PostgreSQL database for the Next.js frontend (Prisma)
  db:
    image: postgres:16-alpine
    container_name: album-conceptualizer-db
    environment:
      POSTGRES_USER: album
      POSTGRES_PASSWORD: album_dev
      POSTGRES_DB: album_conceptualizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U album"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for rate limiting, caching, and real-time collaboration
  redis:
    image: redis:7-alpine
    container_name: album-conceptualizer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # REST API service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: album-conceptualizer-api
    ports:
      - "8000:8000"
    volumes:
      - api_data:/app/data
      - ./output:/app/output
    environment:
      - ALBUM_CONCEPTUALIZER_STORAGE_BACKEND=sqlite
      - ALBUM_CONCEPTUALIZER_CORS_ORIGINS=http://localhost:3000
      - ALBUM_CONCEPTUALIZER_RATE_LIMIT_ENABLED=true
      - ALBUM_CONCEPTUALIZER_RATE_LIMIT_BACKEND=memory
      - ALBUM_CONCEPTUALIZER_QUOTA_ENABLED=true
      - ALBUM_CONCEPTUALIZER_QUOTA_BACKEND=memory
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/live').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Next.js frontend
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: album-conceptualizer-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://album:album_dev@db:5432/album_conceptualizer
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - ENABLE_DEV_LOGIN=1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  # Gradio UI service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    container_name: album-conceptualizer-ui
    ports:
      - "7860:7860"
    volumes:
      - api_data:/app/data
      - ./output:/app/output
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    profiles:
      - full
    healthcheck:
      test: ["CMD", "python", "-c", "import album_conceptualizer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development service with hot reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: album-conceptualizer-dev
    ports:
      - "7860:7860"
    volumes:
      - .:/app
      - /app/__pycache__
      - /app/.ruff_cache
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=DEBUG
    command: python -m album_conceptualizer.cli ui --host 0.0.0.0 --debug
    profiles:
      - dev

  # Test runner service
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: album-conceptualizer-test
    volumes:
      - .:/app
      - /app/__pycache__
    environment:
      - PYTHONPATH=/app
    command: pytest -v --cov=album_conceptualizer --cov-report=term-missing
    profiles:
      - test

  # Linting service
  lint:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: album-conceptualizer-lint
    volumes:
      - .:/app
    command: ruff check album_conceptualizer/ tests/
    profiles:
      - lint

  # Vector database for RAG (optional)
  chromadb:
    image: chromadb/chroma:latest
    container_name: album-conceptualizer-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    profiles:
      - full
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  api_data:
  chroma_data:

networks:
  default:
    name: album-conceptualizer-network
