site_name: Album Conceptualizer
site_description: A full-stack workspace for building coherent concept albums
site_author: Lorenzo
site_url: https://gr8monk3ys.github.io/album-conceptualizer

repo_name: gr8monk3ys/album-conceptualizer
repo_url: https://github.com/gr8monk3ys/album-conceptualizer
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2024 Lorenzo

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gr8monk3ys/album-conceptualizer
  generator: false

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Production: getting-started/production.md
      - Web Staging Checklist: getting-started/web-staging-checklist.md
  - Product:
      - What This Repo Does: product/what-it-does.md
  - Developer Guide:
      - Repo Map: developer/repo-map.md
      - Web Route Reference: developer/web-route-reference.md
      - Web API Examples: developer/web-api-examples.md
      - Architecture: developer/architecture.md
      - Data Model: developer/data-model.md
      - Architecture Decisions: developer/architecture-decisions.md
      - Local Development: developer/local-development.md
      - Testing & Quality: developer/testing-and-quality.md
  - Operations:
      - Runbooks: operations/runbooks.md
  - Launch:
      - Paid Launch Roadmap: getting-started/paid-launch-roadmap.md
      - Paid Alpha Execution Plan: getting-started/paid-alpha-execution-plan.md
      - Launch Copy Kit: getting-started/launch-copy-kit.md
      - Pricing & Packaging: getting-started/pricing-packaging.md
      - 10-User Paid Alpha Plan: getting-started/paid-alpha-plan.md
  - API Reference:
      - REST API: api/rest-api.md
