[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "album-conceptualizer"
version = "0.1.0"
description = "A RAG-powered concept album ideation system with multi-agent orchestration"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
authors = [
    {name = "Lorenzo", email = "lorenzosca7@protonmail.ch"}
]
keywords = ["music", "ai", "rag", "concept-album", "crewai", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI/ML
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-anthropic>=0.1.0",
    "langchain-openai>=0.0.5",

    # RAG & Vector Store
    "chromadb>=0.4.22",
    "sentence-transformers>=2.2.2",

    # Multi-Agent Framework
    "crewai>=0.28.0",
    "crewai-tools>=0.1.0",

    # Music Theory & Processing
    "music21>=9.1.0",
    "pretty-midi>=0.2.10",
    "midiutil>=1.2.1",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",

    # UI
    "gradio>=4.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
full = [
    "weaviate-client>=4.0.0",
    "python-osc>=1.8.0",
    "musicbrainzngs>=0.7.1",
]

[project.scripts]
album-conceptualizer = "album_conceptualizer.cli:main"

[project.urls]
Homepage = "https://github.com/gr8monk3ys/album-conceptualizer"
Repository = "https://github.com/gr8monk3ys/album-conceptualizer"
Issues = "https://github.com/gr8monk3ys/album-conceptualizer/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
