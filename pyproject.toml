[project]
name = "album-conceptualizer"
version = "0.1.0"
description = "A RAG-powered concept album ideation system with multi-agent orchestration"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.11"
authors = [{ name = "Lorenzo", email = "lorenzosca7@protonmail.ch" }]
keywords = ["music", "ai", "rag", "concept-album", "crewai", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.11.7",
    "pydantic-settings>=2.8.1",
    "python-dotenv>=1.1.1,<1.3.0",
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "tenacity>=9.1.3",
    "rich>=14.3.2",
    # FastAPI for REST API
    # The upper bound is load-bearing, not caution. From fastapi 0.137.0,
    # nested include_router silently drops routes: a router included into a
    # router included into the app contributes NOTHING, with no error raised.
    # This API is built from exactly that shape, so an unbounded install
    # yields a server that boots, answers /health, and serves none of its 104
    # /api/v1 routes -- indistinguishable from a healthy deploy until a
    # request 404s.
    #
    # Bisected on 2026-08-29, identical on Python 3.13 and 3.14:
    #   fastapi 0.129.0, 0.133.0, 0.136.0 -> route registered
    #   fastapi 0.137.0, 0.137.2, 0.138.x, 0.139.2, 0.141.1 -> route LOST
    # Not starlette: 0.139.2 pinned back to starlette 0.52.1 is still broken.
    # Re-test with tests/test_nested_router_registration.py before raising.
    "fastapi>=0.128.2,<0.137",
    "uvicorn[standard]>=0.37.0",
    "stripe>=12.0.0",
]

[project.optional-dependencies]
# AI/ML dependencies
ai = [
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-anthropic>=1.3.1",
    "crewai>=1.9.3",
    "crewai-tools>=1.9.3",
]


# RAG dependencies
rag = [
    "chromadb>=1.1.0,<1.6.0",
    "sentence-transformers>=5.2.2",
]

# Music processing
music = [
    "music21>=9.7.1",
    "pretty-midi>=0.2.10",
    "midiutil>=1.2.1",
]

# Data processing
data = [
    "pandas>=3.0.0",
    "numpy>=2.4.2",
]

# UI
ui = ["gradio>=6.5.1"]

# Full installation (all optional deps)
full = [
    "album-conceptualizer[ai,rag,music,data,ui]",
    "weaviate-client>=4.17.0",
    "python-osc>=1.9.3",
    "musicbrainzngs>=0.7.1",
]

# Development dependencies
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
    "ruff>=0.13.1",
    "mypy>=1.19.0",
    "pre-commit>=4.3.0",
    "python-semantic-release>=10.4.1",
]

# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-git-revision-date-localized-plugin>=1.5.1",
]

[project.scripts]
album-conceptualizer = "album_conceptualizer.cli:main"

[project.urls]
Homepage = "https://github.com/gr8monk3ys/album-conceptualizer"
Repository = "https://github.com/gr8monk3ys/album-conceptualizer"
Issues = "https://github.com/gr8monk3ys/album-conceptualizer/issues"
Documentation = "https://github.com/gr8monk3ys/album-conceptualizer#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["album_conceptualizer"]

[tool.hatch.build.targets.sdist]
include = [
    "/album_conceptualizer",
    "/tests",
    "/README.md",
    "/LICENSE",
]

# Ruff configuration (replaces black, isort, flake8, pylint)
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "E741",    # ambiguous variable name
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments (same call as PLR0913 above;
               # ruff added this rule later, so a version bump began flagging
               # 23 existing signatures the project had already opted out of)
    "PLR2004", # magic value comparison
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLW0603", # global statement (used for singleton settings)
    "PLW2901", # loop variable overwritten (intentional)
    "ARG001",  # unused function argument (common in base classes)
    "ARG002",  # unused method argument
    "PLC0415", # import not at top level (used for lazy imports)
    "RUF012",  # mutable class attributes (used in pydantic/crewai)
    "TC001",   # move import into type-checking block
    "TC002",   # move import into type-checking block
    "TC003",   # move import into type-checking block
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["album_conceptualizer"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "unit: marks unit-level tests focused on isolated module behavior",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "mock: marks tests that explicitly use monkeypatch/mocking fixtures",
]

# Coverage configuration
[tool.coverage.run]
source = ["album_conceptualizer"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    # Legacy Gradio UI — requires optional 'ui' extra, not exercised in CI
    "album_conceptualizer/ui/app.py",
    # CLI entry point — tested via integration, not unit coverage
    "album_conceptualizer/cli.py",
    # Optional RAG modules — require 'rag' extra (ChromaDB, sentence-transformers)
    "album_conceptualizer/rag/indexer.py",
    "album_conceptualizer/rag/retriever.py",
    "album_conceptualizer/rag/vector_store.py",
    # Optional export formats — require 'music' extra
    "album_conceptualizer/export/audio.py",
    "album_conceptualizer/export/musicxml.py",
    # Optional telemetry — requires opentelemetry SDK, not installed in dev extras
    "album_conceptualizer/telemetry.py",
    # AI agents — require LLM API keys (Anthropic/OpenAI) and CrewAI runtime
    "album_conceptualizer/agents/*",
    # RAG embeddings — require sentence-transformers / ML model downloads
    "album_conceptualizer/rag/embeddings.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# MyPy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = false
check_untyped_defs = true

# Semantic Release configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["album_conceptualizer/__init__.py:__version__"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "uv build"
commit_message = "release: v{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.commit_parser_options]
allowed_tags = [
    "build",
    "chore",
    "ci",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^Merge",
    "^chore\\(release\\):",
]

[tool.semantic_release.remote]
name = "origin"
type = "github"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.uv]
constraint-dependencies = [
    # PYSEC-2026-2132: click <8.3.3. Only ever a transitive dep here
    # (crewai, python-semantic-release, lancedb), so constrain rather than
    # add it as a direct dependency.
    "click>=8.3.3",
]
