services:
  caddy:
    image: caddy:2
    container_name: album-conceptualizer-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - ALBUM_CONCEPTUALIZER_DOMAIN=${ALBUM_CONCEPTUALIZER_DOMAIN:-localhost}
    depends_on:
      - api
      - app
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: album-conceptualizer-redis
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: album-conceptualizer-api
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ALBUM_CONCEPTUALIZER_API_KEYS=${ALBUM_CONCEPTUALIZER_API_KEYS:?Set ALBUM_CONCEPTUALIZER_API_KEYS in .env}
      - ALBUM_CONCEPTUALIZER_STRICT_PRODUCTION=${ALBUM_CONCEPTUALIZER_STRICT_PRODUCTION:-true}
      - ALBUM_CONCEPTUALIZER_STORAGE_BACKEND=${ALBUM_CONCEPTUALIZER_STORAGE_BACKEND:-sqlite}
      - ALBUM_CONCEPTUALIZER_STORAGE_DB=${ALBUM_CONCEPTUALIZER_STORAGE_DB:-./data/album_conceptualizer.db}
      - ALBUM_CONCEPTUALIZER_CORS_ORIGINS=${ALBUM_CONCEPTUALIZER_CORS_ORIGINS:?Set ALBUM_CONCEPTUALIZER_CORS_ORIGINS to your public origin}
      - ALBUM_CONCEPTUALIZER_RATE_LIMIT_ENABLED=${ALBUM_CONCEPTUALIZER_RATE_LIMIT_ENABLED:-true}
      - ALBUM_CONCEPTUALIZER_RATE_LIMIT_BACKEND=${ALBUM_CONCEPTUALIZER_RATE_LIMIT_BACKEND:-redis}
      - ALBUM_CONCEPTUALIZER_RATE_LIMIT_PER_MINUTE=${ALBUM_CONCEPTUALIZER_RATE_LIMIT_PER_MINUTE:-120}
      - ALBUM_CONCEPTUALIZER_QUOTA_ENABLED=${ALBUM_CONCEPTUALIZER_QUOTA_ENABLED:-true}
      - ALBUM_CONCEPTUALIZER_QUOTA_BACKEND=${ALBUM_CONCEPTUALIZER_QUOTA_BACKEND:-redis}
      - ALBUM_CONCEPTUALIZER_QUOTA_DAILY_LIMIT=${ALBUM_CONCEPTUALIZER_QUOTA_DAILY_LIMIT:-1000}
      - ALBUM_CONCEPTUALIZER_REDIS_URL=${ALBUM_CONCEPTUALIZER_REDIS_URL:-redis://redis:6379/0}
      - ALBUM_CONCEPTUALIZER_SUBSCRIPTION_REQUIRED=${ALBUM_CONCEPTUALIZER_SUBSCRIPTION_REQUIRED:-false}
      - ALBUM_CONCEPTUALIZER_BILLING_PROVIDER=${ALBUM_CONCEPTUALIZER_BILLING_PROVIDER:-stripe}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ALBUM_CONCEPTUALIZER_STRIPE_PRICE_ID_PRO=${ALBUM_CONCEPTUALIZER_STRIPE_PRICE_ID_PRO:-}
      - ALBUM_CONCEPTUALIZER_STRIPE_PRICE_ID_TEAM=${ALBUM_CONCEPTUALIZER_STRIPE_PRICE_ID_TEAM:-}
      - ALBUM_CONCEPTUALIZER_BILLING_SUCCESS_URL=${ALBUM_CONCEPTUALIZER_BILLING_SUCCESS_URL:-http://localhost:7860/billing/success}
      - ALBUM_CONCEPTUALIZER_BILLING_CANCEL_URL=${ALBUM_CONCEPTUALIZER_BILLING_CANCEL_URL:-http://localhost:7860/billing/cancel}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/live').status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    container_name: album-conceptualizer-ui
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import album_conceptualizer"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: album-conceptualizer-network

volumes:
  caddy_data:
  caddy_config:
  redis_data:
